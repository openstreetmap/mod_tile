---
name: Lint

on:
  pull_request:
  push:

jobs:
  clang-format:
    env:
      ANALYSIS_TARGETS: includes/*.h includes/*.hpp src/*.c src/*.cpp tests/*.cpp tests/*.hpp
    name: Lint with `ClangFormat`
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Provision environment
        uses: ./.github/actions/dependencies/install/apt-get
        with:
          packages: clang-format
      - name: Run `clang-format` in `--dry-run` mode
        run: |
          clang-format \
            --dry-run \
            --Werror \
            --style=file \
            ${ANALYSIS_TARGETS}
      - name: Run `clang-format` in `-i` mode if `--dry-run` mode had any changes
        run: |
          clang-format \
            --Werror \
            --style=file \
            -i \
            ${ANALYSIS_TARGETS}
        if: failure()
      - name: Generate `ClangFormat.patch` file
        run: |
          ${ASTYLE_CMD}
          git diff --patch > ClangFormat.patch
        if: failure()
      - name: Upload `ClangFormat.patch` file
        uses: actions/upload-artifact@v7
        with:
          name: ClangFormat.patch
          path: ClangFormat.patch
        if: failure()

  cmakelint:
    name: Lint with `CMakeLint`
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Provision environment
        run: pip install --user cmakelint
      - name: Run linter
        run: |
          cmakelint --linelength=125 \
            CMakeLists.txt \
            */CMakeLists.txt \
            */*.cmake

  mandoc:
    name: Lint with `mandoc -T lint -W warning`
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Provision environment
        uses: ./.github/actions/dependencies/install/apt-get
        with:
          packages: mandoc
      - name: Run linter
        run: |
          mandoc -T lint -W warning docs/man/*.*

  prettier:
    name: Lint with `Prettier`
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Provision environment
        run: npm install prettier
      - name: Run linter
        run: |
          npx prettier --check .
